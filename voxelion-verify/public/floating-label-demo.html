<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floating Label Input</title>
<style>
    :root {
        --violet: #111111;
        --track: #c9c5d4;
        --text: #1e1b29;
        --text-muted: #8a8499;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #faf9fc;
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 56px;
    }

    h1 {
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: -0.01em;
    }

    .states {
        display: flex;
        flex-direction: column;
        gap: 40px;
        width: min(420px, 88vw);
    }

    .state-label {
        font-size: .78rem;
        font-weight: 600;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 10px;
    }

    /* ---- floating label field: underline only ---- */
    .field {
        position: relative;
        padding-top: 18px;
    }

    .field input {
        width: 100%;
        border: none;
        border-bottom: 1.5px solid var(--track);
        background: transparent;
        padding: 8px 2px;
        font-size: 1rem;
        color: var(--text);
        outline: none;
        transition: border-color .25s ease;
    }

    .field label {
        position: absolute;
        left: 2px;
        top: 26px;
        font-size: 1rem;
        color: var(--text-muted);
        pointer-events: none;
        transform-origin: left top;
        transition: transform .25s ease, color .25s ease;
    }

    /* floated: focused OR non-empty (placeholder=" " keeps :placeholder-shown accurate) */
    .field input:focus + label,
    .field input:not(:placeholder-shown) + label {
        transform: translateY(-20px) scale(.78);
        color: var(--violet);
    }

    .field input:focus {
        border-bottom-color: var(--violet);
    }

    /* animated accent bar that sweeps in on focus */
    .field .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 1.5px;
        background: var(--violet);
        transform: scaleX(0);
        transform-origin: center;
        transition: transform .25s ease;
    }

    .field input:focus ~ .bar {
        transform: scaleX(1);
    }
</style>
</head>
<body>

<h1>Floating Label Input</h1>

<div class="states">
    <div>
        <div class="state-label">Empty</div>
        <div class="field">
            <input type="email" id="email-empty" placeholder=" " autocomplete="off">
            <label for="email-empty">Email address</label>
            <span class="bar"></span>
        </div>
    </div>

    <div>
        <div class="state-label">Filled</div>
        <div class="field">
            <input type="email" id="email-filled" placeholder=" " value="volunteer@example.com" autocomplete="off">
            <label for="email-filled">Email address</label>
            <span class="bar"></span>
        </div>
    </div>

    <div>
        <div class="state-label">Focused</div>
        <div class="field">
            <input type="email" id="email-focused" placeholder=" " autofocus autocomplete="off">
            <label for="email-focused">Email address</label>
            <span class="bar"></span>
        </div>
    </div>
</div>

</body>
</html>
