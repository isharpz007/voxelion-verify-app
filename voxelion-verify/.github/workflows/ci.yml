name: CI

on:
    push:
        branches: [main, master]
    pull_request:

jobs:
    backend:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  extensions: mbstring, openssl, pdo_sqlite, sqlite3, gd, curl
                  coverage: none

            - name: Validate composer files
              run: composer validate --strict

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate
                  mkdir -p storage/app/keys

            - name: Generate dev handoff keys
              run: php artisan voxelion:keys

            - name: Run migrations (isolated SQLite)
              run: |
                  touch database/database.sqlite
                  php artisan migrate --force

            - name: Pint (format check)
              run: ./vendor/bin/pint --test

            - name: PHPStan (Larastan)
              run: ./vendor/bin/phpstan analyse --memory-limit=1G

            - name: Tests
              run: php artisan test

    frontend:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Production build
              run: npm run build
